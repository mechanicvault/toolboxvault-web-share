# Alembic configuration for Toolbox Vault.
# The database URL always comes from the app settings (env vars), never
# from this file — env.py overrides sqlalchemy.url at runtime.

[alembic]
script_location = alembic
prepend_sys_path = .

# Template used for new migration files.
file_template = %%(rev)s_%%(slug)s

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
