<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Machined panel frame for CSS border-image (Steel theme).
       Slice 32: corners are chamfered brackets with a real screw head;
       edges are chrome rails (bright catch line, dark groove) that
       stretch along their length — the rail gradient runs ACROSS the
       rail, so stretching never distorts it. Drawn at 2x: rendered
       with border-image-width ~16px (scale 0.5). -->
  <defs>
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#767c85"/>
      <stop offset="0.5" stop-color="#3c4047"/>
      <stop offset="1" stop-color="#22242a"/>
    </linearGradient>
    <linearGradient id="railV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9099"/>
      <stop offset="0.45" stop-color="#494e55"/>
      <stop offset="1" stop-color="#1d1f24"/>
    </linearGradient>
    <radialGradient id="domeS" cx="0.38" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.4" stop-color="#a9afb8"/>
      <stop offset="0.75" stop-color="#54585f"/>
      <stop offset="1" stop-color="#232529"/>
    </radialGradient>
    <g id="cnr">
      <path d="M2 32 L2 11 L11 2 L32 2 L32 15 L15 15 L15 32 Z" fill="url(#bracket)" stroke="#0b0c0e" stroke-opacity="0.55"/>
      <path d="M17.5 30 L17.5 17.5 L30 17.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.3"/>
      <path d="M3.6 10.4 L10.4 3.6" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.3"/>
      <path d="M20.5 32 L20.5 20.5 L32 20.5" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
      <g>
        <circle cx="15" cy="15" r="8.2" fill="url(#domeS)" stroke="#0c0d10" stroke-opacity="0.6"/>
        <path d="M9.8 15 H20.2 M15 9.8 V20.2" stroke="#141518" stroke-width="2.4"/>
        <circle cx="12.7" cy="12.5" r="1.6" fill="#ffffff" opacity="0.5"/>
      </g>
    </g>
    <g id="edgT">
      <rect x="32" y="2" width="32" height="13" fill="url(#railV)"/>
      <rect x="32" y="2" width="32" height="1.6" fill="#e8ecf1" opacity="0.55"/>
      <rect x="32" y="15" width="32" height="2" fill="#000000" opacity="0.45"/>
      <rect x="32" y="17" width="32" height="1" fill="#ffffff" opacity="0.10"/>
    </g>
  </defs>
  <use href="#cnr"/>
  <use href="#cnr" transform="translate(96 0) scale(-1 1)"/>
  <use href="#cnr" transform="translate(0 96) scale(1 -1)"/>
  <use href="#cnr" transform="translate(96 96) scale(-1 -1)"/>
  <use href="#edgT"/>
  <use href="#edgT" transform="translate(0 96) scale(1 -1)"/>
  <use href="#edgT" transform="translate(0 96) rotate(-90)"/>
  <use href="#edgT" transform="translate(96 0) rotate(90)"/>
</svg>
