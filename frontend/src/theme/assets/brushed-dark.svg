<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tileable dark brushed-metal grain (Steel theme).
       Anisotropic feTurbulence: fast variation across X, slow down Y,
       which reads as fine VERTICAL brushing like the reference panel.
       stitchTiles makes the noise wrap seamlessly. Static raster once
       per tile size — no live filter on DOM elements. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.006" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="micro" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.015" numOctaves="1" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#0e1013"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.34"/>
  <rect width="256" height="256" filter="url(#micro)" opacity="0.16"/>
</svg>
